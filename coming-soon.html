<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ridgeline Productions — We'll be back soon</title>
  <meta name="description" content="Ridgeline Productions is taking a short pause. We'll be back soon.">
  <meta name="robots" content="noindex, nofollow">

  <!-- Open Graph -->
  <meta property="og:title" content="Ridgeline Productions — We'll be back soon">
  <meta property="og:description" content="We're taking a short pause and will be back soon.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://ridgelineproductions.com">

  <link rel="icon" type="image/png" href="/brand/favicon-100.png">
  <link rel="apple-touch-icon" href="/brand/favicon-500.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    @font-face {
      font-family: 'Sharp Sans No2';
      src: url('/fonts/SharpSansNo2-Book.otf') format('opentype');
      font-weight: 400; font-style: normal; font-display: swap;
    }
    @font-face {
      font-family: 'Sharp Sans No2';
      src: url('/fonts/SharpSansNo2-Medium.otf') format('opentype');
      font-weight: 500; font-style: normal; font-display: swap;
    }

    :root {
      --bg: #0a0a0a;
      --fg: #e8e6e3;
      --fg-soft: #9a958d;
      --muted: #5a564f;
      --cream: #f9ebdd;
      --orange: #df852c;
      --hairline: rgba(232, 230, 227, 0.12);
      --font-display: 'Sharp Sans No2', 'Space Grotesk', -apple-system, sans-serif;
      --font-body: 'Sharp Sans No2', 'Inter', -apple-system, sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }

    body {
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--fg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem 1.5rem;
      position: relative;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Warm ambient glow — brand orange/cream */
    body::before {
      content: "";
      position: absolute;
      top: -28%;
      left: 50%;
      transform: translateX(-50%);
      width: min(95vw, 1000px);
      height: min(95vw, 1000px);
      background: radial-gradient(circle, rgba(223, 133, 44, 0.14) 0%, rgba(223, 133, 44, 0) 60%);
      pointer-events: none;
      z-index: 0;
    }
    body::after {
      content: "";
      position: absolute;
      bottom: -32%;
      left: 50%;
      transform: translateX(-50%);
      width: min(120vw, 1200px);
      height: min(75vw, 760px);
      background: radial-gradient(circle, rgba(249, 235, 221, 0.06) 0%, rgba(249, 235, 221, 0) 62%);
      pointer-events: none;
      z-index: 0;
    }

    .wrap {
      position: relative;
      z-index: 1;
      max-width: 580px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: rise 950ms cubic-bezier(0.25, 0.1, 0.25, 1) both;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .logo {
      width: 220px;
      max-width: 64vw;
      height: auto;
      margin-bottom: 2.75rem;
      filter: drop-shadow(0 10px 30px rgba(0, 0, 0, 0.5));
    }

    .eyebrow {
      font-family: var(--font-body);
      font-size: 0.7rem;
      font-weight: 500;
      letter-spacing: 0.34em;
      text-transform: uppercase;
      color: var(--orange);
      margin-bottom: 1.5rem;
    }

    h1 {
      font-family: var(--font-display);
      font-size: clamp(2.3rem, 7.5vw, 3.6rem);
      font-weight: 500;
      line-height: 1.06;
      letter-spacing: -0.02em;
      color: var(--cream);
      margin-bottom: 1.25rem;
    }

    .lead {
      font-size: clamp(1rem, 3.4vw, 1.12rem);
      font-weight: 400;
      line-height: 1.7;
      color: var(--fg-soft);
      max-width: 440px;
      margin: 0 auto 2.5rem;
    }

    .divider {
      width: 52px;
      height: 2px;
      background: linear-gradient(90deg, var(--orange), rgba(223, 133, 44, 0.25));
      border-radius: 2px;
      margin: 0 auto 2.5rem;
    }

    .contact {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.85rem;
    }
    .contact-label {
      font-size: 0.68rem;
      font-weight: 500;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .email-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      background: var(--orange);
      color: #1a1208;
      text-decoration: none;
      font-size: 0.98rem;
      font-weight: 600;
      letter-spacing: 0.01em;
      padding: 0.9rem 1.9rem;
      border-radius: 9999px;
      box-shadow: 0 14px 32px rgba(223, 133, 44, 0.26);
      transition: transform 200ms cubic-bezier(0.4,0,0.2,1), box-shadow 200ms cubic-bezier(0.4,0,0.2,1), background 200ms;
    }
    .email-btn:hover {
      background: #ec9540;
      transform: translateY(-2px);
      box-shadow: 0 18px 40px rgba(223, 133, 44, 0.32);
    }
    .email-btn svg { width: 17px; height: 17px; }

    .footnote {
      margin-top: 3rem;
      font-size: 0.7rem;
      font-weight: 400;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
    }

    @media (max-width: 480px) {
      .logo { width: 180px; margin-bottom: 2.25rem; }
      h1 { margin-bottom: 1rem; }
      .lead { margin-bottom: 2rem; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <img src="/brand/ridgeline-wordmark-white.png" alt="Ridgeline Productions" class="logo">

    <p class="eyebrow">Ridgeline Productions</p>

    <h1>We'll be back soon</h1>

    <p class="lead">
      Our site is taking a short pause while we put the finishing touches on something new.
      Thank you for your patience — we'll be back shortly.
    </p>

    <div class="divider"></div>

    <div class="contact">
      <span class="contact-label">In the meantime, reach us</span>
      <a href="mailto:info@ridgelineproductions.com" class="email-btn" aria-label="Email info@ridgelineproductions.com">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="4" width="20" height="16" rx="2"></rect>
          <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
        </svg>
        info@ridgelineproductions.com
      </a>
    </div>

    <p class="footnote">Santa Barbara, California</p>
  </div>
</body>
</html>
